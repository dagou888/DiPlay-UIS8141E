name: Build Mazda UIS8141E Android 8.1 APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Restore the original DiPlay icon assets
        run: |
          rm -f common/src/main/res/drawable/ic_carplay.xml common/src/main/res/drawable/ic_carplay.png
          curl -fL --retry 3 \
            -o common/src/main/res/drawable/ic_carplay.png \
            https://raw.githubusercontent.com/shihabal3amri/DiPlay/ef4e3fe5c39fa49a532a9570ecb930618a06e106/common/src/main/res/drawable/ic_carplay.png
          file common/src/main/res/drawable/ic_carplay.png | grep -q 'PNG image data'

      - name: Restore stable car-test debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diplay-android-debug-keystore-v1

      - name: Ensure stable car-test debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Prepare official DiPlay runtime authentication
        run: |
          curl -fL --retry 3 -o DiPlay-0.2.13.apk https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.13/DiPlay-0.2.13.apk
          test "$(sha256sum DiPlay-0.2.13.apk | awk '{print $1}')" = "aed9eac786e7c0e80a2929dc2f0c2e1d0df318ca8fd83ae7c2988a98bb4cd7e6"
          mkdir -p ci-auth
          unzip -q -j DiPlay-0.2.13.apk 'assets/offline-mfi/*' -d ci-auth
          test -s ci-auth/identity.pk8
          test -s ci-auth/certificate.p7b
          mkdir -p ci-auth/offline-mfi
          mv ci-auth/identity.pk8 ci-auth/offline-mfi/identity.pk8
          mv ci-auth/certificate.p7b ci-auth/offline-mfi/certificate.p7b
          echo "DIPLAY_AUTH_ASSETS_DIR=$GITHUB_WORKSPACE/ci-auth" >> "$GITHUB_ENV"

      - name: Apply Mazda visible branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("common/src/main/res")
          text_node = re.compile(r'>([^<]*(?:比亚迪|BYD|byd)[^<]*)<', re.IGNORECASE)
          for p in root.glob("values*/**/*.xml"):
              if not p.is_file():
                  continue
              s = p.read_text(encoding="utf-8", errors="ignore")
              def repl(m):
                  t = m.group(1).replace("比亚迪", "马自达")
                  t = re.sub(r"BYD", "Mazda", t, flags=re.IGNORECASE)
                  return ">" + t + "<"
              ns = text_node.sub(repl, s)
              if ns != s:
                  p.write_text(ns, encoding="utf-8")
          PY

      - name: Build authenticated Mazda APK for UIS8141E
        run: |
          ./gradlew :mobile:assembleDebug --stacktrace
          mkdir -p output
          cp mobile/build/outputs/apk/debug/*.apk output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk
          sha256sum output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk

      - name: Verify APK contents
        run: |
          APK="output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk"
          unzip -l "$APK" | grep -E 'offline-mfi/(identity.pk8|certificate.p7b)' >/dev/null
          unzip -p "$APK" resources.arsc >/tmp/resources.bin
          strings /tmp/resources.bin | grep -q "Mazda"

      - name: Upload Mazda APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Mazda-UIS8141E-Android8.1
          path: output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk
          if-no-files-found: error
          retention-days: 14
