name: Build Mazda Android 8.1 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.1

      - name: Download official DiPlay 0.2.13 APK
        run: |
          curl -fL --retry 3             -o DiPlay-0.2.13.apk             https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.13/DiPlay-0.2.13.apk
          echo "Official SHA256:"
          sha256sum DiPlay-0.2.13.apk

      - name: Install Apktool
        run: |
          curl -fL --retry 3             -o apktool.jar             https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version

      - name: Decode APK
        run: java -Xmx4g -jar apktool.jar d -f DiPlay-0.2.13.apk -o decoded

      - name: Apply Mazda branding and Android 8.1 manifest compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("decoded")

          # Visible branding strings only. Do not touch package names, component names,
          # URLs, or BYD-specific identifiers that are part of the runtime implementation.
          for p in root.glob("res/values*/**/*.xml"):
              if not p.is_file():
                  continue
              s = p.read_text(encoding="utf-8", errors="ignore")
              ns = s.replace("比亚迪", "马自达").replace("BYD", "Mazda").replace("byd", "mazda")
              if ns != s:
                  p.write_text(ns, encoding="utf-8")

          manifest = root / "AndroidManifest.xml"
          s = manifest.read_text(encoding="utf-8", errors="ignore")
          s = re.sub(r'(android:minSdkVersion\s*=\s*")28(")', r'\g<1>27\g<2>', s)
          s = re.sub(r'android:icon\s*=\s*"@[^"]+"', 'android:icon="@drawable/mazda_logo"', s, count=1)
          s = re.sub(r'android:roundIcon\s*=\s*"@[^"]+"', 'android:roundIcon="@drawable/mazda_logo"', s, count=1)
          manifest.write_text(s, encoding="utf-8")

          apky = root / "apktool.yml"
          if apky.exists():
              t = apky.read_text(encoding="utf-8", errors="ignore")
              t = t.replace("versionName: 0.2.13", "versionName: 0.2.13-Mazda-UIS8141E")
              apky.write_text(t, encoding="utf-8")
          PY

      - name: Download Mazda emblem
        run: |
          mkdir -p branding
          curl -fL --retry 3             -o branding/mazda_logo.svg             'https://upload.wikimedia.org/wikipedia/commons/b/b6/Mazda_logo_with_emblem%2C_new.svg'
          magick -background none branding/mazda_logo.svg -resize 512x512 branding/mazda_logo.png
          mkdir -p decoded/res/drawable
          cp branding/mazda_logo.png decoded/res/drawable/mazda_logo.png
          file branding/mazda_logo.png

      - name: Rebuild branded APK
        run: |
          java -Xmx4g -jar apktool.jar b decoded -o DiPlay-Mazda-UIS8141E-Android8.1-unsigned.apk

      - name: Align and sign APK
        run: |
          SDK="${ANDROID_HOME}/build-tools/35.0.1"
          keytool -genkeypair -v             -keystore mazda-debug.jks             -storepass android             -keypass android             -alias mazda             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Mazda DiPlay, OU=UIS8141E, O=Local Build, L=, ST=, C=US"
          "$SDK/zipalign" -p -f 4             DiPlay-Mazda-UIS8141E-Android8.1-unsigned.apk             DiPlay-Mazda-UIS8141E-Android8.1-aligned.apk
          "$SDK/apksigner" sign             --ks mazda-debug.jks             --ks-pass pass:android             --key-pass pass:android             --out DiPlay-Mazda-UIS8141E-Android8.1.apk             DiPlay-Mazda-UIS8141E-Android8.1-aligned.apk
          "$SDK/apksigner" verify --verbose DiPlay-Mazda-UIS8141E-Android8.1.apk
          sha256sum DiPlay-Mazda-UIS8141E-Android8.1.apk

      - name: Upload Mazda APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Mazda-UIS8141E-Android8.1
          path: DiPlay-Mazda-UIS8141E-Android8.1.apk
          if-no-files-found: error
          retention-days: 14
