          openssl pkcs12 -export -out ci/diplay-debug.p12             -inkey ci/diplay-debug.key -in ci/diplay-debug.crt             -name diplay -passout pass:android
          keytool -importkeystore -noprompt             -srckeystore ci/diplay-debug.p12 -srcstoretype PKCS12 -srcstorepass android             -destkeystore ci/diplay-debug.keystore -deststorepass android -destkeypass android             -srcalias diplay -destalias diplay
          keytool -list -keystore ci/diplay-debug.keystore -storepass android -alias diplay >/dev/null
          rm -f ci/diplay-debug.key ci/diplay-debug.crt ci/diplay-debug.p12

      - name: Prepare official DiPlay runtime authentication
        run: |
          curl -fL --retry 3 \
            -o DiPlay-0.2.13.apk \
            https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.13/DiPlay-0.2.13.apk
          test "$(sha256sum DiPlay-0.2.13.apk | awk '{print $1}')" = \
            "aed9eac786e7c0e80a2929dc2f0c2e1d0df318ca8fd83ae7c2988a98bb4cd7e6"
          mkdir -p ci-auth
          unzip -q -j DiPlay-0.2.13.apk 'assets/offline-mfi/*' -d ci-auth
          test -s ci-auth/identity.pk8
          test -s ci-auth/certificate.p7b
          mkdir -p ci-auth/offline-mfi
          mv ci-auth/identity.pk8 ci-auth/offline-mfi/identity.pk8
          mv ci-auth/certificate.p7b ci-auth/offline-mfi/certificate.p7b
          echo "DIPLAY_AUTH_ASSETS_DIR=$GITHUB_WORKSPACE/ci-auth" >> "$GITHUB_ENV"

      - name: Apply Mazda visible branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("common/src/main/res")
          import re
          text_node = re.compile(r'>([^<]*(?:比亚迪|BYD|byd)[^<]*)<', re.IGNORECASE)
          for p in root.glob("values*/**/*.xml"):
              if not p.is_file():
                  continue
              s = p.read_text(encoding="utf-8", errors="ignore")
              def repl(m):
                  t = m.group(1).replace("比亚迪", "马自达")
                  t = re.sub(r"BYD", "Mazda", t, flags=re.IGNORECASE)
                  return ">" + t + "<"
              ns = text_node.sub(repl, s)
              if ns != s:
                  p.write_text(ns, encoding="utf-8")
          PY

      - name: Build authenticated Mazda APK for UIS8141E
        run: |
          ./gradlew :mobile:assembleDebug --stacktrace
          mkdir -p output
          cp mobile/build/outputs/apk/debug/*.apk output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk
          sha256sum output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk

      - name: Verify APK contents
        run: |
          APK="output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk"
          unzip -l "$APK" | grep -E 'offline-mfi/(identity.pk8|certificate.p7b)' >/dev/null
          unzip -p "$APK" resources.arsc >/tmp/resources.bin
          strings /tmp/resources.bin | grep -q "Mazda"

      - name: Upload Mazda APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Mazda-UIS8141E-Android8.1
          path: output/DiPlay-Mazda-UIS8141E-Android8.1-debug.apk
          if-no-files-found: error
          retention-days: 14
